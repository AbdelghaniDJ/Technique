<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل تقنيات التصوير الشعاعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d1417;
    --panel: #141d22;
    --panel-2: #1b262c;
    --line: #263339;
    --cyan: #5fd8e0;
    --cyan-dim: #2c5a5e;
    --bone: #eef2ee;
    --bone-dim: #a9b6b8;
    --amber: #e3a857;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% 0%, rgba(95,216,224,0.06), transparent 55%),
      var(--bg);
    color:var(--bone);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="en"] body, html[lang="fr"] body{ font-family:'IBM Plex Sans', sans-serif; }
  h1,h2,h3, .num-face{ font-family:'IBM Plex Sans Arabic', 'Tajawal', sans-serif; }
  html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3,
  html[lang="fr"] h1, html[lang="fr"] h2, html[lang="fr"] h3{ font-family:'IBM Plex Sans', sans-serif; }

  /* ===== Top bar ===== */
  header{
    border-bottom:1px solid var(--line);
    padding:22px 28px 20px;
    position:sticky; top:0; z-index:20;
    background:rgba(13,20,23,0.92);
    backdrop-filter:blur(6px);
  }
  .header-row{
    display:flex; align-items:flex-end; justify-content:space-between;
    max-width:1180px; margin:0 auto; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{
    width:42px;height:42px;flex:none;
    border:1.5px solid var(--cyan-dim);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--cyan);
    font-family:'IBM Plex Sans Arabic';
    font-weight:700; font-size:17px;
    box-shadow: 0 0 14px rgba(95,216,224,0.18) inset;
  }
  h1{margin:0; font-size:21px; font-weight:600; letter-spacing:0.2px;}
  .subtitle{margin:3px 0 0; color:var(--bone-dim); font-size:13.5px;}

  .controls-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}

  .lang-switch{
    display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  .lang-switch button{
    background:var(--panel); border:none; color:var(--bone-dim); padding:9px 14px;
    font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; letter-spacing:.03em;
    cursor:pointer; border-inline-start:1px solid var(--line);
  }
  .lang-switch button:first-child{border-inline-start:none;}
  .lang-switch button.active{background:var(--panel-2); color:var(--cyan);}

  .search-wrap{position:relative; min-width:220px; flex:1; max-width:320px;}
  #search{
    width:100%; background:var(--panel); border:1px solid var(--line);
    color:var(--bone); padding:11px 14px; border-radius:var(--radius);
    font-family:inherit; font-size:14px; outline:none;
    transition:border-color .15s ease;
  }
  #search:focus{border-color:var(--cyan-dim);}
  #search::placeholder{color:#5a6c70;}

  /* ===== Layout ===== */
  main{max-width:1180px; margin:0 auto; padding:26px 28px 70px; display:flex; gap:26px; align-items:flex-start;}

  nav.regions{
    width:230px; flex:none; position:sticky; top:104px;
    display:flex; flex-direction:column; gap:2px;
  }
  nav.regions .nav-label{
    color:#5a6c70; font-size:11.5px; letter-spacing:.03em; margin:0 4px 8px;
  }
  .region-btn{
    text-align:start; background:none; border:none; color:var(--bone-dim);
    padding:9px 12px; border-radius:var(--radius); cursor:pointer;
    font-family:inherit; font-size:14.5px; display:flex; justify-content:space-between;
    align-items:center; gap:8px; border-inline-start:2px solid transparent;
  }
  .region-btn:hover{background:var(--panel); color:var(--bone);}
  .region-btn.active{
    background:var(--panel-2); color:var(--cyan); border-inline-start-color:var(--cyan);
    font-weight:600;
  }
  .region-btn .count{font-size:11.5px; color:#5a6c70; font-family:'IBM Plex Sans Arabic';}
  .region-btn.active .count{color:var(--cyan-dim);}

  section.content{flex:1; min-width:0;}

  .region-heading{margin:2px 0 4px; font-size:19px; font-weight:600;}
  .region-note{color:var(--bone-dim); font-size:13px; margin:0 0 20px;}

  /* ===== Table ===== */
  .table-shell{
    border:1px solid var(--line); border-radius:6px;
    overflow-x:auto; overflow-y:hidden;
    background:var(--panel);
    -webkit-overflow-scrolling:touch;
  }
  table{width:100%; min-width:520px; border-collapse:collapse; font-size:14px;}
  thead th{
    text-align:start; font-weight:500; color:var(--bone-dim);
    font-size:12px; letter-spacing:.02em;
    padding:12px 16px; border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  thead th.numeric, td.numeric{text-align:center;}
  tbody td{padding:13px 16px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(95,216,224,0.035);}
  .exam-name{font-weight:500; color:var(--bone);}
  .exam-view{display:block; color:var(--bone-dim); font-size:12px; margin-top:2px;}
  .val{
    font-family:'IBM Plex Sans Arabic'; font-weight:600; font-size:14.5px; color:var(--bone);
  }
  html[lang="en"] .val, html[lang="fr"] .val{ font-family:'IBM Plex Sans'; }
  .val.kv{color:var(--cyan);}
  .val.ms{color:var(--amber);}
  .sid{color:var(--bone-dim); font-size:12.5px;}
  .grid-tag{
    display:inline-block; font-size:10.5px; padding:1px 6px; border:1px solid var(--cyan-dim);
    color:var(--cyan-dim); border-radius:20px; margin-inline-end:6px;
  }

  .empty-state{padding:60px 20px; text-align:center; color:var(--bone-dim);}

  footer{
    max-width:1180px; margin:0 auto; padding:0 28px 50px; color:#5a6c70; font-size:12.5px; line-height:1.9;
  }
  footer .disclaimer{
    border-top:1px solid var(--line); padding-top:18px; margin-top:8px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 980px){
    main{gap:20px; padding:24px 22px 60px;}
    nav.regions{width:190px;}
  }

  @media (max-width: 820px){
    .header-row{align-items:stretch;}
    main{flex-direction:column; padding:20px 16px 50px;}
    nav.regions{
      width:100%; position:static; flex-direction:row; overflow-x:auto;
      gap:6px; padding-bottom:10px; -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
    }
    nav.regions .nav-label{display:none;}
    .region-btn{
      white-space:nowrap; border-inline-start:none; border-bottom:2px solid transparent;
      flex:none;
    }
    .region-btn.active{border-inline-start-color:transparent; border-bottom-color:var(--cyan);}
    header{padding:16px 16px 14px; position:static;}
    .controls-right{width:100%;}
    .search-wrap{max-width:none;}
  }

  @media (max-width: 600px){
    .brand{width:100%;}
    h1{font-size:18px;}
    .subtitle{font-size:12.5px;}
    .controls-right{flex-direction:column; align-items:stretch; gap:10px;}
    .lang-switch{align-self:flex-start;}
    .lang-switch button{flex:1; padding:9px 0; text-align:center;}
    section.content{min-width:0;}
    .region-heading{font-size:17px;}

    /* Collapse the table into stacked cards */
    .table-shell{border:none; background:none; overflow:visible;}
    table{min-width:0; border-spacing:0 10px; border-collapse:separate;}
    thead{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
    tbody tr{
      display:block; background:var(--panel); border:1px solid var(--line);
      border-radius:8px; margin-bottom:10px; padding:4px 0;
    }
    tbody tr:hover{background:var(--panel);}
    tbody td{
      display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px dashed var(--line); padding:9px 14px;
    }
    tbody tr td:last-child{border-bottom:none;}
    tbody td:first-child{display:block;}
    tbody td:first-child .exam-name{display:block; margin-bottom:2px;}
    td.numeric, td.sid{text-align:end;}
    td[data-label]::before{
      content:attr(data-label); color:var(--bone-dim); font-size:12px; font-weight:400;
    }
  }

  @media (max-width: 380px){
    header{padding:14px 12px 12px;}
    main{padding:16px 12px 40px;}
    .brand-mark{width:36px; height:36px; font-size:14px;}
    h1{font-size:16.5px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">Rx</div>
      <div>
        <h1 id="pageTitle">دليل تقنيات التصوير الشعاعي</h1>
        <p class="subtitle" id="pageSubtitle">قيم استرشادية لـ kVp — mA — الزمن (msec) لمريض بالغ متوسط البنية</p>
      </div>
    </div>
    <div class="controls-right">
      <div class="lang-switch">
        <button data-lang="ar" class="active">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="fr">FR</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="text" placeholder="ابحث عن فحص…">
      </div>
    </div>
  </div>
</header>

<main>
  <nav class="regions" id="regionNav">
    <p class="nav-label" id="navLabel">مناطق الجسم</p>
  </nav>

  <section class="content">
    <h2 class="region-heading" id="regionTitle">—</h2>
    <p class="region-note" id="regionNote"></p>
    <div class="table-shell">
      <table>
        <thead>
          <tr>
            <th style="width:36%" id="thExam">الفحص</th>
            <th class="numeric">kVp</th>
            <th class="numeric">mA</th>
            <th class="numeric">msec</th>
            <th class="sid-h" id="thSid">مسافة التصوير (SID)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none"></div>
    </div>
  </section>
</main>

<footer>
  <div class="disclaimer" id="disclaimer"></div>
</footer>

/* ---------------- STATE ---------------- */
let lang = "ar";
let currentRegion = REGIONS[0];
let searchTerm = "";

const htmlRoot = document.getElementById('htmlRoot');
const nav = document.getElementById('regionNav');
const tbody = document.getElementById('tableBody');
const regionTitle = document.getElementById('regionTitle');
const regionNote = document.getElementById('regionNote');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('search');

function buildNav(){
  nav.querySelectorAll('.region-btn').forEach(b=>b.remove());
  REGIONS.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'region-btn';
    btn.dataset.region = key;
    btn.innerHTML = `<span class="rname">${REGION_LABEL[key][lang]}</span><span class="count">${EXAMS[key].length}</span>`;
    btn.addEventListener('click', () => {
      currentRegion = key;
      searchTerm = "";
      searchInput.value = "";
      render();
    });
    nav.appendChild(btn);
  });
}

function applyLangUI(){
  const t = UI[lang];
  htmlRoot.setAttribute('lang', lang);
  htmlRoot.setAttribute('dir', t.dir);
  document.title = t.pageTitle;
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('pageSubtitle').textContent = t.pageSubtitle;
  document.getElementById('navLabel').textContent = t.navLabel;
  document.getElementById('thExam').textContent = t.thExam;
  document.getElementById('thSid').textContent = t.thSid;
  searchInput.placeholder = t.searchPlaceholder;
  document.getElementById('disclaimer').textContent = t.disclaimer;
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

function render(){
  const t = UI[lang];
  document.querySelectorAll('.region-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.region === currentRegion && searchTerm === "");
  });

  let rows = [];
  if(searchTerm.trim() !== ""){
    regionTitle.textContent = t.searchResults;
    regionNote.textContent = t.searchFor(searchTerm);
    REGIONS.forEach(key=>{
      EXAMS[key].forEach(exam=>{
        const hay = (exam.name[lang] + " " + exam.view[lang] + " " + REGION_LABEL[key][lang]).toLowerCase();
        if(hay.includes(searchTerm.toLowerCase())){
          rows.push(exam);
        }
      });
    });
  } else {
    regionTitle.textContent = REGION_LABEL[currentRegion][lang];
    regionNote.textContent = REGION_NOTE[currentRegion][lang];
    rows = EXAMS[currentRegion];
  }

  tbody.innerHTML = "";
  emptyState.style.display = rows.length ? 'none' : 'block';
  emptyState.textContent = t.empty;

  rows.forEach(exam=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <span class="exam-name">${exam.name[lang]}</span>
        <span class="exam-view">${exam.grid ? `<span class="grid-tag">${t.grid}</span>` : ''}${exam.view[lang]}</span>
      </td>
      <td class="numeric" data-label="kVp"><span class="val kv">${exam.kv}</span></td>
      <td class="numeric" data-label="mA"><span class="val">${exam.ma}</span></td>
      <td class="numeric" data-label="msec"><span class="val ms">${exam.ms}</span></td>
      <td class="sid" data-label="${t.thSid}">${exam.sid[lang]}</td>
    `;
    tbody.appendChild(tr);
  });
}

function setLang(newLang){
  lang = newLang;
  applyLangUI();
  buildNav();
  render();
}

document.querySelectorAll('.lang-switch button').forEach(b=>{
  b.addEventListener('click', ()=> setLang(b.dataset.lang));
});

searchInput.addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

setLang('ar');
</script>
